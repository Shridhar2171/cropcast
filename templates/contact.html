<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - CropCast Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<custom-header></custom-header>

<div class="container mx-auto px-4 py-12">

    <div class="max-w-5xl mx-auto bg-white p-10 rounded-2xl shadow-lg">

        <h1 class="text-4xl font-bold text-primary mb-8">Contact Us</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

            <!-- Form -->
            <div>
                <h2 class="text-xl font-semibold mb-4">Send us a message</h2>

                <form class="space-y-4">
                    <input type="text" placeholder="Name" class="w-full p-3 border rounded-lg focus:ring-primary" />
                    <input type="email" placeholder="Email" class="w-full p-3 border rounded-lg focus:ring-primary" />
                    <textarea placeholder="Message" rows="4" class="w-full p-3 border rounded-lg focus:ring-primary"></textarea>

                    <button class="w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition">
    Send Message
</button>

                </form>
            </div>

            <!-- Info -->
            <div>
                <h2 class="text-xl font-semibold mb-4">Our Information</h2>

                <p class="flex items-center gap-3 text-gray-700 mb-3">
                    📍 <span>123 Farm Lane, Agricultural City</span>
                </p>
                <p class="flex items-center gap-3 text-gray-700 mb-3">
                    📧 <span>contact@cropcast.com</span>
                </p>
                <p class="flex items-center gap-3 text-gray-700 mb-6">
                    📞 <span>+1 (555) 123-4567</span>
                </p>

                <h3 class="font-semibold mb-3">Follow Us</h3>
                <div class="flex space-x-4 text-2xl text-primary">
                    <a href="#">🌐</a>
                    <a href="#">🐦</a>
                    <a href="#">📸</a>
                    <a href="#">🔗</a>
                </div>
            </div>

        </div>

    </div>

</div>

<custom-footer></custom-footer>

<script src="/components/header.js"></script>
<script src="/components/mobile-menu.js"></script>
<script src="/components/footer.js"></script>

</body>
</html>
